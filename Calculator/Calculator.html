<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="myCalculator.css" />
</head>
<body>
  <h1>My Calculator</h1>
  <input type="text" class="display" disabled />
  <div class="calculator-container">
    <div class="buttons">
      <button>AC</button>
      <button>+/-</button>
      <button>%</button>
      <button>/</button>
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>*</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>-</button>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>
      <button>0</button>
      <button>.</button>
      <button>√</button>
      <button class="equals">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
