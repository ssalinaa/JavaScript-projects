<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="Contributor.css">
</head>
<body>
  <div class="register-box-contributor">
    <h1>Create Account<br>Contributor</h1>
    <form>
      <input type="text" placeholder="Name" required>
      <input type="text" placeholder="Username" required>
      <input type="text" placeholder="Address" required>
      <input type="text" placeholder="Phone" required>
      <input type="text" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <select required>
        <option value="" disabled selected>Select Type Of User</option>
        <option value="Individual">CANTEEN</option>
        <option value="Organization">RESTAURANT</option>
        <option value="Company">GROCERY_STORE</option>
      </select>      <input type="text" placeholder="Description" required>
      <button type="submit">Register</button>
    </form>
    <div class="image1"></div>
    <div class="image2"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
