<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="Donee.css">
</head>
<body>
  <div class="register-box-regular-user">
    <h1>Create Account<br>Regular User</h1>
    <form>
      <input type="text" placeholder="Name" required>
      <input type="text" placeholder="Username" required>
      <input type="text" placeholder="Address" required>
      <input type="text" placeholder="Phone" required>
      <input type="text" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <input type="text" placeholder="Ucn" required>
      <button type="submit">Register</button>
    </form>
  </div>
  <div class="register-box-ngo-user">
    <h1>Create Account<br> NGO User</h1>
    <form>
      <input type="text" placeholder="Name" required>
      <input type="text" placeholder="Username" required>
      <input type="text" placeholder="Address" required>
      <input type="text" placeholder="Phone" required>
      <input type="text" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <input type="text" placeholder="Description" required>
      <button type="submit">Register</button>
    </form>
    <div class="image1"></div>
    <div class="image2"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
